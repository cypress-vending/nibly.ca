<!doctype html>
<html lang="en-CA">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Book a Meeting | NIBLY SNACKS</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    // With an email already in the link (HubSpot ?email={{ contact.email }}), forward straight to the booking page,
    // keeping the query string and hash exactly as they are. Otherwise the form below asks for one first.
    (function () {
      var email = (new URLSearchParams(location.search).get('email') || '').trim();
      if (email && email.indexOf('{{') < 0) location.replace('https://profitpad-inc.github.io/cypress-webtools/book/' + location.search + location.hash);
    })();
  </script>
  <style>
    /* Copies the cypress-webtools booking page (docs/styles.css, "Booking redirect page"), which in turn copies
       Nibly's own HubSpot form: Poppins, a #f5f6f2 panel, 20px labels, 3px inputs and a black button. */
    @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 400; font-display: swap; src: url("assets/poppins-n4-00000000000000007735fdb4.woff2") format("woff2"); }
    @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 700; font-display: swap; src: url("assets/poppins-n7-00000000000000007735fdbb.woff2") format("woff2"); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body { min-height: 100vh; background: #ffffff; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .book { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: 'Poppins', sans-serif; background: #ffffff; }
    .book .card { width: 100%; max-width: 480px; padding: 40px; text-align: center; background: rgb(245, 246, 242); border: 0; border-radius: 0; box-shadow: none; }
    .book img { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 16px; }
    .book h1 { margin: 0; font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 700; color: rgb(51, 71, 91); }
    .book p { margin: 8px 0 0; font-size: 16px; color: rgb(51, 71, 91); }
    .book__form { margin-top: 28px; text-align: left; }
    .book__label { display: block; margin: 0 0 10px; font-size: 20px; color: #212d3a; }
    .book__req { color: #e51520; }
    .book__input {
      display: block; width: 100%; margin: 0; padding: 12px;
      font: 16px 'Poppins', sans-serif; color: #212d3a; background: #ffffff;
      border: 1px solid #959494; border-radius: 3px; transition: box-shadow .2s ease;
    }
    .book__input::placeholder { color: rgba(81, 99, 131, .64); }
    .book__input:hover { box-shadow: 0 0 2px #959494; }
    .book__input:focus { outline: none; box-shadow: 0 0 3px #959494; }
    .book__input[aria-invalid="true"] { border-color: #e51520; }
    .book__err { margin-top: 10px; font-size: 16px; color: #e51520; }
    .book__btn {
      display: block; margin: 40px auto 0; padding: 12px 24px;
      font: 700 20px 'Poppins', sans-serif; color: #ffffff; background: #000000;
      border: 0; border-radius: 3px; cursor: pointer; transition: transform .2s ease-out;
    }
    .book__btn:hover { transform: translateY(-1px); }
    .book__btn:active { transform: translateY(1px); }
    .book__btn:focus-visible { outline: 2px solid #000000; outline-offset: 3px; }
    @media (max-width: 430px) {
      .book .card { padding: 32px 20px; }
      .book__btn { width: 100%; }
    }
  </style>

</head>

<body>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1051763753797502&amp;ev=PageView&amp;noscript=1"
alt=""></noscript>

  <main class="book">
    <div class="card" id="box"><img src="favicon.png" alt=""><h1>Book a meeting</h1><p>Enter your email and we'll open the right person's calendar.</p><form class="book__form" id="email-form" novalidate=""><label class="book__label" for="email">Email<span class="book__req" aria-hidden="true">*</span></label><input class="book__input" type="email" id="email" autocomplete="email" inputmode="email" required="" aria-required="true" aria-describedby="email-err"><div class="book__err" id="email-err" role="alert" hidden="">Please enter a valid email address.</div><button class="book__btn" type="submit">Continue</button></form></div>
  </main>
  <script>
    (function () {
      var form = document.getElementById('email-form');
      var input = document.getElementById('email');
      var err = document.getElementById('email-err');
      function setError(on) {
        err.hidden = !on;
        if (on) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
      }
      input.addEventListener('input', function () { if (!err.hidden) setError(false); });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = input.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError(true); input.focus(); return; }
        // Keep every other parameter as-is; drop an empty or unfilled email and add the typed one.
        // encodeURIComponent writes + as %2B, which the booking page reads back as a literal +.
        var rest = location.search.replace(/^\?/, '').split('&').filter(function (p) { return p && !/^email(=|$)/.test(p); });
        rest.push('email=' + encodeURIComponent(email));
        location.href = 'https://profitpad-inc.github.io/cypress-webtools/book/?' + rest.join('&') + location.hash;
      });
    })();
  </script>
</body>

</html>
